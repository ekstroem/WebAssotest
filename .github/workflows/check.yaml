name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::flexdashboard
            any::rhandsontable
            any::shinyscreenshot
            any::logistf
            any::rmarkdown
      - name: Run self-checks
        run: Rscript tests/check.R
